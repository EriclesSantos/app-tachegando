<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="tachegando-map-tiles" content="https://tile.openstreetmap.org/{z}/{x}/{y}.png">
    <title>Tá Chegando</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .tachegando-map { width: 100%; height: 100%; background: #f5f5f5; }
        .tachegando-map-marker {
            background: #ff6b00;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 1px 5px #0005;
            display: grid;
            place-items: center;
        }
    </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="tachegando-map.js"></script>
<script src="tachegando.js"></script>
</body>
</html>
